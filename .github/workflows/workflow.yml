name: 1. Unit Test

on: [push]

jobs:
  run-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Execute Unit Test
        run: node dist/UnitTest.js
