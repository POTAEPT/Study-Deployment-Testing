name: Unit Tests

on: 
    push:
        branches: [ "lec02" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dist

    steps:
      - name: Pull code from Repository
        uses: actions/checkout@v4

      - name: install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: install ci
        run: npm ci

      - name: run Unit Test
        run: npm test
